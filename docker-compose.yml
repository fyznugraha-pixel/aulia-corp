version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: auliacorp_user
      POSTGRES_PASSWORD: auliacorp_password
      POSTGRES_DB: auliacorp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
